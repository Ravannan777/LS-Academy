<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 8 Result | LS Academy</title>
    <meta name="theme-color" content="#10151F">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="result-page-body">

    <div class="back-btn-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>

    <div class="page-container">
        <h2><span class="eyebrow">LS Academy · Report Card</span>Class 8 — Check Exam Result</h2>

        <div class="form-group">
            <label for="rollNumber">Roll Number:</label>
            <input type="text" id="rollNumber" placeholder="Enter Roll Number (e.g., 101)">
        </div>

        <div class="form-group">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="Enter Student Name">
        </div>

        <button onclick="checkStudentResult()" class="submit-btn">Check Result</button>

        <div id="resultBox"></div>
    </div>

    <!-- ഫയർബേസ് v9 കോഡ് -->
    <script type="module">
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
        import { db } from "./firebase-config.mjs";

        window.checkStudentResult = async function() {
            const rollNo = document.getElementById('rollNumber').value.trim();
            const sName = document.getElementById('studentName').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (rollNo === "" || sName === "") {
                alert("ദയവായി റോൾ നമ്പറും കുട്ടിയുടെ പേരും നൽകുക!");
                return;
            }

            try {
                // എട്ടാം ക്ലാസിനുള്ള കളക്ഷൻ നെയിം
                const q = query(
                    collection(db, "class8_results"),
                    where("rollNumber", "==", rollNo),
                    where("name", "==", sName)
                );

                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    resultBox.style.display = "block";
                    resultBox.innerHTML = "<p class='error-text'>ഇത്തരം വിവരങ്ങൾ ഒന്നും കണ്ടെത്താനായില്ല. റോൾ നമ്പറും പേരും കൃത്യമാണെന്ന് ഉറപ്പുവരുത്തുക.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    resultBox.style.display = "block";
                    resultBox.innerHTML = `
                        <h4>${data.name}</h4>
                        <p class="result-roll">റോൾ നമ്പർ: ${data.rollNumber}</p>
                        <div class="marks-grid">
                            <div class="marks-item"><span class="subject">മലയാളം പാർട്ട് 1</span><span class="score">${data.malayalam1 ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">മലയാളം പാർട്ട് 2</span><span class="score">${data.malayalam2 ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">ഇംഗ്ലീഷ്</span><span class="score">${data.english ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">ഹിന്ദി</span><span class="score">${data.hindi ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">ഗണിതം</span><span class="score">${data.maths ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">ഫിസിക്സ്</span><span class="score">${data.physics ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">കെമിസ്ട്രി</span><span class="score">${data.chemistry ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">സോഷ്യൽ സയൻസ്</span><span class="score">${data.socialScience ?? 'N/A'}</span></div>
                            <div class="marks-item"><span class="subject">ബയോളജി</span><span class="score">${data.biology ?? 'N/A'}</span></div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error getting document: ", error);
                alert("എന്തെങ്കിലും പ്രശ്നം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.");
            }
        };
    </script>
</body>
</html>
