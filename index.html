<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LS Academy</title>

  <!-- Mobile App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#10151F">

  <!-- Tailwind CSS (layout utilities only — colors/type come from style.css) & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pb-10">

  <!-- TOP HEADER (letterhead) -->
  <nav class="ls-header">
    <div class="ls-brand">
      <img src="logo.png" alt="LS Academy crest">
      <div>
        <h1>LS Academy</h1>
        <div class="tagline">INSPIRING SUCCESS, SHAPING FUTURES </div>
      </div>
    </div>

    <!-- Admin Switch Button -->
    <button id="nav-admin-btn" onclick="toggleAdminView()" class="nav-btn">
      <i class="fa-solid fa-user-lock"></i>
      <span>അഡ്മിൻ ലോഗിൻ</span>
    </button>
  </nav>

  <main class="ls-main">

    <!-- =================================================== -->
    <!-- 1. STUDENT VIEW -->
    <!-- =================================================== -->
    <section id="user-view">

      <!-- Welcome Card -->
      <div class="welcome-card">
        <div>
          <h2>Welcome, Students 👋</h2>
          <p>ഇന്നത്തെ അറിയിപ്പുകളും ടൈംടേബിളും താഴെ കാണാം.</p>
        </div>
        <button id="enable-notif-btn" class="notif-btn">
          <i class="fa-regular fa-bell"></i>
          <span>Notify</span>
        </button>
      </div>

      <!-- Quick class result links -->
      <div class="laurel-divider">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M2 13C4.5 9 3.5 4.5 1 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M2 10.5L4.5 9M2 7.5L5 6.3M2 4.5L4.7 3.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
        <span style="font-family:var(--font-display); font-size:0.85rem; font-weight:600; color:var(--navy-950);">Check Your Result</span>
        <span class="laurel-line"></span>
      </div>
      <div class="class-buttons">
        <a href="class7.html" class="btn">Class 7</a>
        <a href="class8.html" class="btn">Class 8</a>
        <a href="class9.html" class="btn">Class 9</a>
        <a href="class10.html" class="btn">Class 10</a>
      </div>

      <!-- Notice Board -->
      <div class="section-card">
        <h3><i class="fa-solid fa-bullhorn"></i> Notice Board</h3>
        <div class="laurel-divider">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M2 13C4.5 9 3.5 4.5 1 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M2 10.5L4.5 9M2 7.5L5 6.3M2 4.5L4.7 3.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          <span class="laurel-line"></span>
        </div>
        <div id="notices-container" class="space-y-3">
          <p class="text-xs text-gray-400 text-center py-4">Loading notices...</p>
        </div>
      </div>

      <!-- Time Table -->
      <div class="section-card">
        <h3><i class="fa-regular fa-calendar-check"></i> Time Table</h3>
        <div class="laurel-divider">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M2 13C4.5 9 3.5 4.5 1 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M2 10.5L4.5 9M2 7.5L5 6.3M2 4.5L4.7 3.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          <span class="laurel-line"></span>
        </div>
        <div id="timetable-container" class="space-y-3">
          <p class="text-xs text-gray-400 text-center py-4">Loading timetable...</p>
        </div>
      </div>

    </section>

    <!-- =================================================== -->
    <!-- 2. ADMIN VIEW -->
    <!-- =================================================== -->
    <section id="admin-view" class="hidden space-y-5">

      <!-- Back to Home Bar -->
      <div class="admin-strip">
        <span><i class="fa-solid fa-shield-halved"></i> Admin Mode</span>
        <button onclick="toggleAdminView()" class="admin-back-btn">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Home</span>
        </button>
      </div>

      <!-- Add Notice Form -->
      <div class="section-card">
        <h3><i class="fa-solid fa-plus"></i> Publish New Notice</h3>
        <form id="notice-form">
          <div class="field-group">
            <label class="field-label">Notice Title</label>
            <input type="text" id="notice-title" required placeholder="e.g., Exam Postponed" class="field-input">
          </div>
          <div class="field-group">
            <label class="field-label">Notice Details</label>
            <textarea id="notice-desc" rows="3" placeholder="Enter details here..." class="field-textarea"></textarea>
          </div>
          <button type="submit" id="notice-submit-btn" class="btn-gold">
            <i class="fa-solid fa-paper-plane"></i>
            <span>അറിയിപ്പ് പോസ്റ്റ് ചെയ്യുക</span>
          </button>
        </form>
      </div>

      <!-- Add Timetable Form -->
      <div class="section-card">
        <h3><i class="fa-solid fa-clock"></i> Update Timetable</h3>
        <form id="timetable-form">
          <div class="field-group">
            <label class="field-label">Select Class</label>
            <select id="tt-class" class="field-select">
              <option value="Class 5">Class 5</option>
              <option value="Class 6">Class 6</option>
              <option value="Class 7">Class 7</option>
              <option value="Class 8">Class 8</option>
              <option value="Class 9">Class 9</option>
              <option value="Class 10">Class 10</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Subject & Time Details</label>
            <input type="text" id="tt-details" required placeholder="e.g., Maths - 5:00 PM to 6:30 PM" class="field-input">
          </div>
          <button type="submit" id="tt-submit-btn" class="btn-navy">
            <i class="fa-solid fa-calendar-plus"></i>
            <span>ടൈംടേബിൾ അപ്‌ഡേറ്റ് ചെയ്യുക</span>
          </button>
        </form>
      </div>

    </section>

  </main>

  <!-- Firebase App (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Shared Firebase config -->
  <script src="firebase-init.js"></script>

  <!-- JS FILES -->
  <script src="app.js"></script>
  <script src="admin.js"></script>

</body>
</html>
