<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f0f2f5; margin: 0;">

    <!-- ഹോം പേജിലേക്ക് പോകാനുള്ള ബട്ടൺ -->
    <div class="back-btn-container">
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <!-- പ്രധാന കണ്ടെയ്നർ -->
    <div class="page-container">
        <h2> 10 -Check Student Result</h2>
        
        <div class="form-group">
            <label for="rollNumber">Roll Number:</label>
            <input type="text" id="rollNumber" placeholder="Enter Roll Number (e.g., 101)">
        </div>

        <div class="form-group">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="Enter Student Name">
        </div>

        <button onclick="checkStudentResult()" class="submit-btn">Check Result</button>
        
        <!-- റിസൾട്ട് കാണിക്കുന്ന ബോക്സ് -->
        <div id="resultBox">
            <!-- ഡാറ്റ ഇവിടെ ലോഡ് ചെയ്യപ്പെടും -->
        </div>
    </div>
    <script>
        
        function checkStudentResult() {
    const rollNo = document.getElementById('rollNumber').value.trim();
    const sName = document.getElementById('studentName').value.trim();
    const resultBox = document.getElementById('resultBox');

    if (rollNo === "" || sName === "") {
        alert("ദയവായി റോൾ നമ്പറും കുട്ടിയുടെ പേരും നൽകുക!");
        return;
    }

    // ഫയർബേസ് ഫയർസ്റ്റോറിൽ നിന്ന് ഡാറ്റ പരിശോധിക്കുന്നു (Class 10 ഉദാഹരണത്തിന്)
    db.collection("class10_results")
        .where("rollNumber", "==", rollNo)
        .where("name", "==", sName)
        .get()
        .then((querySnapshot) => {
            if (querySnapshot.empty) {
                resultBox.style.display = "block";
                resultBox.innerHTML = "<p style='color: red;'>ഇത്തരം വിവരങ്ങൾ ഒന്നും കണ്ടെത്താനായില്ല. റോൾ നമ്പറും പേരും കൃത്യമാണെന്ന് ഉറപ്പുവരുത്തുക.</p>";
            } else {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    resultBox.style.display = "block";
                    resultBox.innerHTML = `
                        <h4 style="color: #1a73e8; margin-bottom: 10px;">റിസൾട്ട് വിവരങ്ങൾ:</h4>
                        <p><strong>പേര്:</strong> ${data.name}</p>
                        <p><strong>റോൾ നമ്പർ:</strong> ${data.rollNumber}</p>
                        <p><strong>മാർക്കുകൾ:</strong> ${data.marks}</p>
                    `;
                });
            }
        })
        .catch((error) => {
            console.error("Error getting document: ", error);
            alert("എന്തെങ്കിലും പ്രശ്നം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.");
        });
}
    </script>
</body>
</html>
